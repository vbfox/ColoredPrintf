name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      PAKET_SKIP_RESTORE_TARGETS: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install legacy libssl (required by netcoreapp2.0 test runtime)
      run: |
        wget -q http://launchpadlibrarian.net/555132422/libssl1.0.0_1.0.2n-1ubuntu5.7_amd64.deb
        wget -q http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb
        sudo dpkg -i libssl1.0.0_1.0.2n-1ubuntu5.7_amd64.deb
        sudo dpkg -i libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb
        rm libssl1.0.0_1.0.2n-1ubuntu5.7_amd64.deb libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          2
          10
    - name: Restore packages
      run: ./paket.sh restore
    - name: Compile build script
      run: dotnet build src/BlackFox.ColoredPrintf.Build/BlackFox.ColoredPrintf.Build.fsproj
    - name: Build
      run: ./build.sh CI
  windows:
    runs-on: windows-latest
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      PAKET_SKIP_RESTORE_TARGETS: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          2
          10
    - name: Restore packages
      run: ./paket.cmd restore
    - name: Compile build script
      run: dotnet build src/BlackFox.ColoredPrintf.Build/BlackFox.ColoredPrintf.Build.fsproj
    - name: Build
      run: ./build.cmd CI
